<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel da Live · Overlay</title>
<link rel="icon" type="image/png" href="/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@500..900&display=swap" rel="stylesheet">
<!--
  Overlays para OBS / TikTok LIVE Studio (fonte "Navegador" / "Link"), fundo transparente.
  Endereço:  /overlay/<tipo>?estilo=painel|limpo&top=10&escala=1&titulo=1
  Tops:      &layout=compacto|lado (quantidade embaixo ou ao lado do nome)  &coroa=0 (tira a coroa do 1º)
  Teste:     &teste=1 mostra dados de exemplo (para ver o visual antes da live)
  Cores:     &cor=ffffff (texto)  &destaque=tiktok|ffc83d (bordas, barras, números)  &efeito=sombra|contorno|neon|nenhum
             &fundo=escuro|claro|transparente  &opacidade=0..100  &pulsar=1  &brilho=1  &confete=1
  Vídeos:    /overlay/videos  (toca o vídeo escolhido para cada momento; &mudo=1 tira o som)
  Tipos:     curtidas · presentes · compartilhamentos · metas · batalha · alertas
  metas:     &quais=todas|curtidas|seguidores|diamantes|tiktok
  alertas:   &tipos=seguir,compartilhar,heart,presente,metas,batalha&duracao=5
-->
<style>
  :root{--rosa:#fe2c55;--ciano:#25f4ee;--rosa-rgb:254,44,85;--ciano-rgb:37,244,238;--ouro:#ffc83d;--roxo:#8a5cf6;--ok:#3ddc84;
        --card:rgba(18,18,26,.86);--linha:rgba(255,255,255,.12);--ink:#fff;--muted:rgba(255,255,255,.72)}
  html{font-size:calc(16px * var(--escala, 1))}
  html,body{margin:0;background:transparent;overflow:hidden}
  body{font-family:"TikTok Sans",Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:.75rem}
  *{box-sizing:border-box}
  .some{display:none!important}

  /* ---------- estilo PAINEL (cartão escuro, rosa e ciano) ---------- */
  .painel .caixa{background:var(--card);border:2px solid rgba(var(--rosa-rgb),.55);border-radius:1.25rem;padding:.9rem 1rem 1rem;
    box-shadow:0 .5rem 1.6rem rgba(0,0,0,.35);backdrop-filter:blur(6px);width:23rem}
  .painel .tit{font-weight:900;font-size:1.15rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.45rem;letter-spacing:.02em}
  .painel .tit small{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:700}
  .painel .lin{display:grid;grid-template-columns:1.9rem 2.3rem 1fr auto;align-items:center;gap:.55rem;padding:.38rem .2rem;
    border-bottom:1px solid var(--linha);transition:background .4s}
  .painel .lin:last-child{border-bottom:0}
  .painel .pos{width:1.8rem;height:1.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;
    background:rgba(255,255,255,.1)}
  .painel .lin:nth-child(1) .pos{background:linear-gradient(#ffe27a,#f5a300);color:#3a2600}
  .painel .lin:nth-child(2) .pos{background:linear-gradient(#f2f2f2,#b9b9c4);color:#222}
  .painel .lin:nth-child(3) .pos{background:linear-gradient(#f0b27a,#c06a2b);color:#2b1300}
  .painel .av{width:2.3rem;height:2.3rem;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--ciano),var(--rosa));
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;border:2px solid rgba(255,255,255,.35)}
  .painel .nome{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .painel .val{font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .painel .vazio{color:var(--muted);font-size:.95rem;padding:.4rem .2rem}

  /* ---------- estilo LIMPO (só texto com sombra, direto sobre o vídeo) ---------- */
  .limpo .caixa{width:23rem}
  .limpo, .limpo *{text-shadow:0 0 .25rem #000,0 .1rem .35rem rgba(0,0,0,.9),0 0 .1rem #000}
  .limpo .tit{font-weight:900;font-size:1.2rem;margin:0 0 .4rem;display:flex;gap:.45rem;align-items:center;letter-spacing:.03em;text-transform:uppercase}
  .limpo .tit small{margin-left:auto;font-size:.85rem;opacity:.9}
  .limpo .lin{display:grid;grid-template-columns:1.6rem 2rem 1fr auto;align-items:center;gap:.5rem;padding:.22rem 0}
  .limpo .pos{font-weight:900;font-size:1.05rem;text-align:center}
  .limpo .lin:nth-child(1) .pos{color:#ffd54a} .limpo .lin:nth-child(2) .pos{color:#e6e6ee} .limpo .lin:nth-child(3) .pos{color:#f0a868}
  .limpo .av{width:2rem;height:2rem;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 .3rem rgba(0,0,0,.8);
    background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem}
  .limpo .nome{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .limpo .val{font-weight:900;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .limpo .vazio{opacity:.85;font-size:.95rem}

  /* ---------- Tops compactos: quantidade embaixo do nome ---------- */
  .painel .caixa.compacto{width:17rem;padding:.8rem .85rem .85rem}
  .limpo .caixa.compacto{width:16rem}
  .compacto .tit{flex-wrap:wrap;row-gap:.1rem}
  .compacto .lin{grid-template-columns:1.6rem 2.5rem 1fr;gap:.5rem}
  .painel .compacto .lin{padding:.32rem .15rem}
  .info{display:flex;flex-direction:column;min-width:0;line-height:1.15}
  .compacto .nome{font-size:.98rem}
  .compacto .val{font-size:.88rem;font-weight:800}
  .painel .compacto .val{color:var(--ciano)}
  .painel .compacto .lin:nth-child(1) .val{color:var(--ouro)}
  .avw{position:relative;display:inline-flex;justify-self:center}
  .coroa{position:absolute;left:50%;top:-1.05rem;transform:translateX(-50%) rotate(-10deg);font-size:1.25rem;line-height:1;
    filter:drop-shadow(0 .1rem .15rem rgba(0,0,0,.7));animation:brilha 2.4s ease-in-out infinite}
  @keyframes brilha{50%{transform:translateX(-50%) rotate(-10deg) translateY(-.12rem)}}
  .lin.rei{padding-top:1rem!important}
  .lin.rei .av{border-color:var(--ouro)!important;box-shadow:0 0 .55rem rgba(255,200,61,.75)}
  .selo-teste{position:fixed;top:.3rem;right:.3rem;z-index:9;background:var(--ouro);color:#2a1d00;font:900 .75rem "TikTok Sans",Arial,sans-serif;
    padding:.15rem .5rem;border-radius:99px;text-shadow:none!important;letter-spacing:.04em}

  /* ---------- cores e efeitos escolhidos ---------- */
  body.ef-contorno, body.ef-contorno *{text-shadow:-.07rem -.07rem 0 #000,.07rem -.07rem 0 #000,-.07rem .07rem 0 #000,.07rem .07rem 0 #000,0 .1rem .3rem rgba(0,0,0,.8)!important}
  body.ef-neon, body.ef-neon *{text-shadow:0 0 .2rem var(--brilho-cor),0 0 .55rem var(--brilho-cor),0 0 1rem var(--brilho-cor)!important}
  body.ef-nenhum, body.ef-nenhum *{text-shadow:none!important}
  body.ef-sombra.painel *{text-shadow:0 .08rem .25rem rgba(0,0,0,.55)}
  body.fundo-transparente .caixa, body.fundo-transparente .meta, body.fundo-transparente .batalha, body.fundo-transparente .alerta{backdrop-filter:none;box-shadow:none}
  .av{color:#fff!important;text-shadow:0 .05rem .2rem rgba(0,0,0,.6)!important}
  .fundo-claro .pos{background:rgba(0,0,0,.08)}
  .fundo-claro .compacto .lin:nth-child(1) .val{color:#a86b00}
  .fundo-claro .trilho{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.12)}
  .anim-pulsar .lin.rei .av{animation:pulsa1 1.6s ease-in-out infinite}
  @keyframes pulsa1{50%{transform:scale(1.12);box-shadow:0 0 .9rem var(--ouro)}}
  .anim-brilho .enche, .anim-brilho .bt-cabo .a, .anim-brilho .bt-br span{position:relative;overflow:hidden}
  .anim-brilho .enche::after, .anim-brilho .bt-cabo .a::after, .anim-brilho .bt-br span::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.65) 50%,transparent 80%);transform:translateX(-100%);animation:corre 2.2s ease-in-out infinite}
  @keyframes corre{60%,100%{transform:translateX(100%)}}
  .confete{position:fixed;top:-2rem;width:.6rem;height:1rem;border-radius:.15rem;z-index:20;pointer-events:none;animation:cai linear forwards}
  @keyframes cai{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

  /* ---------- vídeos dos momentos ---------- */
  body.videos{padding:0} #tela-video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:transparent}
  .video-teste{position:fixed;inset:8%;border:.25rem dashed var(--ciano);border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.4rem;font-weight:900;font-size:1.5rem;text-align:center;background:rgba(0,0,0,.35);animation:entra .5s both}
  .video-teste small{font-size:1rem;opacity:.85;font-weight:700}

  .lin.subiu{animation:subiu 1.1s ease-out}
  @keyframes subiu{0%{background:rgba(var(--rosa-rgb),.45)}100%{background:transparent}}
  .val .ic{font-size:.85em;margin-left:.15rem}

  /* ---------- metas ---------- */
  .metas{display:flex;flex-direction:column;gap:.6rem;width:23rem}
  .meta .topo{display:flex;justify-content:space-between;gap:.5rem;font-weight:900;font-size:1rem;margin-bottom:.35rem}
  .meta .topo small{font-weight:700;color:var(--muted);white-space:nowrap}
  .trilho{height:.8rem;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
  .enche{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ciano),var(--rosa));transition:width .8s}
  .meta.seguidores .enche{background:linear-gradient(90deg,#7afcf8,var(--ciano))}
  .meta.diamantes .enche{background:linear-gradient(90deg,var(--ciano),var(--roxo))}
  .meta.tiktok .enche{background:linear-gradient(90deg,#ffe27a,#f5a300)}
  .meta.ok .enche{background:var(--ok)}
  .painel .meta{background:var(--card);border:2px solid rgba(var(--rosa-rgb),.45);border-radius:1rem;padding:.7rem .9rem .8rem}
  .painel .meta.seguidores{border-color:rgba(var(--ciano-rgb),.5)} .painel .meta.diamantes{border-color:rgba(138,92,246,.6)} .painel .meta.tiktok{border-color:rgba(255,200,61,.6)}
  .limpo .trilho{box-shadow:0 0 .4rem rgba(0,0,0,.7)}
  .mtk{display:grid;grid-template-columns:1.5rem 1fr auto;gap:.15rem .5rem;align-items:center;font-size:.92rem;margin-top:.35rem}
  .mtk img{width:1.4rem;height:1.4rem;object-fit:contain} .mtk .trilho{grid-column:2 / 4;height:.55rem}
  .mtk b{font-variant-numeric:tabular-nums}

  /* ---------- batalha ---------- */
  .batalha{width:30rem}
  .painel .batalha{background:var(--card);border:2px solid rgba(var(--rosa-rgb),.6);border-radius:1.25rem;padding:.8rem 1rem .9rem;box-shadow:0 .5rem 1.6rem rgba(0,0,0,.35)}
  .bt-topo{display:flex;justify-content:center;align-items:center;gap:.7rem;margin-bottom:.4rem;flex-wrap:wrap}
  .bt-rot{font-weight:900;letter-spacing:.1em;font-size:.9rem;opacity:.85}
  .bt-tempo{font-weight:900;font-size:1.7rem;font-variant-numeric:tabular-nums}
  .bt-tempo.fim30{color:var(--rosa);animation:pisca 1s infinite} @keyframes pisca{50%{opacity:.4}}
  .bt-res{font-weight:900;font-size:1.6rem} .bt-res.vitoria{color:var(--ok)} .bt-res.empate{color:var(--ciano)}
  .bt-missao{background:var(--ouro);color:#2a1d00;text-shadow:none!important;font-weight:900;font-size:.8rem;border-radius:99px;padding:.15rem .6rem}
  .bt-lados{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem}
  .bt-lado{display:flex;flex-direction:column;min-width:0} .bt-lado.eles{text-align:right}
  .bt-nome{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bt-pts{font-weight:900;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
  .bt-lado.nos .bt-pts{color:var(--rosa)} .bt-lado.eles .bt-pts{color:var(--ciano)}
  .bt-cabo{display:flex;height:.8rem;border-radius:99px;overflow:hidden;margin:.55rem 0 .35rem;background:rgba(255,255,255,.15)}
  .bt-cabo .a{background:var(--rosa);transition:width .6s} .bt-cabo .b{background:var(--ciano);flex:1}
  .bt-time{font-size:.85rem;color:var(--muted)} .bt-time b{color:var(--ink)}
  .bt-rl{display:grid;grid-template-columns:2rem minmax(8rem,1.6fr) 1.4fr 3.5rem;align-items:center;gap:.5rem;padding:.3rem .5rem;border-radius:.7rem;margin:.25rem 0}
  .bt-rl.nos{background:rgba(var(--rosa-rgb),.22);outline:2px solid var(--rosa)}
  .bt-p{font-size:1.05rem;opacity:.85} .bt-v{font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--ciano)} .bt-rl.nos .bt-v{color:var(--rosa)}
  .bt-br{height:.6rem;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
  .bt-br span{display:block;height:100%;background:var(--ciano);border-radius:99px;transition:width .6s} .bt-rl.nos .bt-br span{background:var(--rosa)}

  /* ---------- pote de avatares ---------- */
  body.pote{padding:0} #tela-pote{position:fixed;inset:0;width:100vw;height:100vh;display:block}

  /* ---------- alertas animados ---------- */
  .alertas{position:relative;width:28rem;min-height:6rem}
  .alerta{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-radius:1.2rem;animation:entra .55s cubic-bezier(.2,1.4,.4,1) both}
  .alerta.sai{animation:sai .45s ease-in both}
  .painel .alerta{background:var(--card);border:2px solid var(--rosa);box-shadow:0 .6rem 1.8rem rgba(var(--rosa-rgb),.35)}
  .alerta .emo{font-size:2.6rem;line-height:1;animation:pula 1s ease-in-out infinite}
  .alerta .txt{display:flex;flex-direction:column;min-width:0}
  .alerta .quem{font-weight:900;font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .alerta .oque{font-weight:700;font-size:1.05rem;color:var(--muted)}
  .alerta .av{width:3.2rem;height:3.2rem;border-radius:50%;object-fit:cover;border:3px solid var(--ciano);flex:none}
  .alerta.t-presente{border-color:var(--ouro)} .alerta.t-heart{border-color:#ff7aa2} .alerta.t-compartilhar{border-color:var(--ciano)}
  .alerta.t-meta, .alerta.t-batalha{border-color:var(--ouro)}
  @keyframes entra{0%{opacity:0;transform:translateY(1.2rem) scale(.85)}100%{opacity:1;transform:none}}
  @keyframes sai{to{opacity:0;transform:translateY(-.8rem) scale(.95)}}
  @keyframes pula{50%{transform:translateY(-.25rem) rotate(-6deg)}}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const P = new URLSearchParams(location.search);
const TIPO = (P.get("tipo") || location.pathname.split("/")[2] || "curtidas").toLowerCase();
// Aberta pelo GitHub Pages (https, para o TikTok LIVE Studio): busca os dados no painel aberto neste computador.
const API = location.protocol === "https:" || P.get("porta") ? `http://127.0.0.1:${Number(P.get("porta")) || 8765}` : "";
let conseguiu = false, falhas = 0;
const ESTILO = (P.get("estilo") || "painel").toLowerCase() === "limpo" ? "limpo" : "painel";
const TOP = Math.max(1, Math.min(10, Number(P.get("top")) || 10));
const TITULO = P.get("titulo") !== "0";
const LAYOUT = P.get("layout") === "lado" ? "lado" : "compacto";
const COROA = P.get("coroa") !== "0";
document.documentElement.style.setProperty("--escala", Math.max(.4, Math.min(3, Number(P.get("escala")) || 1)));
document.body.className = ESTILO;
// ---------------- cores e efeitos ----------------
(function aplicarCores() {
  const css = document.documentElement.style, hex = v => /^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : "";
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(",");
  const fundo = ["claro", "transparente"].includes(P.get("fundo")) ? P.get("fundo") : "escuro";
  const op = Math.max(0, Math.min(100, P.get("opacidade") === null ? 86 : Number(P.get("opacidade")) || 0)) / 100;
  const cor = hex(P.get("cor")) || (fundo === "claro" ? "#1c1c24" : "");
  if (cor) { css.setProperty("--ink", cor); css.setProperty("--muted", `rgba(${rgb(cor)},.75)`); }
  const dest = hex(P.get("destaque"));
  if (dest) { css.setProperty("--rosa", dest); css.setProperty("--ciano", dest); css.setProperty("--rosa-rgb", rgb(dest)); css.setProperty("--ciano-rgb", rgb(dest)); }
  css.setProperty("--brilho-cor", dest || "#fe2c55");
  if (fundo === "claro") { css.setProperty("--card", `rgba(255,255,255,${op})`); css.setProperty("--linha", "rgba(0,0,0,.12)"); }
  else if (fundo === "transparente") css.setProperty("--card", "transparent");
  else css.setProperty("--card", `rgba(18,18,26,${op})`);
  const efeito = ["contorno", "neon", "nenhum"].includes(P.get("efeito")) ? P.get("efeito") : "sombra";
  document.body.classList.add("ef-" + efeito, "fundo-" + fundo);
  if (P.get("pulsar") === "1") document.body.classList.add("anim-pulsar");
  if (P.get("brilho") === "1") document.body.classList.add("anim-brilho");
})();
const CONFETE = P.get("confete") === "1";
function soltarConfete() {
  if (!CONFETE) return;
  const cores = ["#fe2c55", "#25f4ee", "#ffc83d", "#8a5cf6", "#3ddc84", "#ffffff"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("span");
    c.className = "confete";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = cores[i % cores.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
    c.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}
const raiz = document.getElementById("raiz");
const num = n => Number(n || 0).toLocaleString("pt-BR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const avatar = p => p.foto ? `<img class="av" src="${esc(p.foto)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;av&quot;>${esc((p.nome || "?")[0].toUpperCase())}</span>'">`
                           : `<span class="av">${esc((p.nome || "?")[0].toUpperCase())}</span>`;

// ---------------- Top 10 ----------------
const TOPS = {
  curtidas: {tit: "❤️ Top curtidas", lista: d => d.top_curtidas, val: p => p.total, ic: "❤️", total: d => num(d.total_curtidas)},
  presentes: {tit: "🎁 Top presentes", lista: d => d.top_presentes, val: p => p.diamantes, ic: "💎", total: d => num(d.total_diamantes) + " 💎"},
  compartilhamentos: {tit: "🔁 Top compartilhamentos", lista: d => d.top_compart, val: p => p.total, ic: "🔁", total: d => num(d.total_compart)},
};
const anteriores = {};
function desenharTop(d) {
  const t = TOPS[TIPO], lista = (t.lista(d) || []).slice(0, TOP);
  raiz.innerHTML = `<div class="caixa ${LAYOUT}">${TITULO ? `<div class="tit">${t.tit.replace("Top", "Top " + TOP)}<small>${t.total(d)}</small></div>` : ""}
    <div>${lista.length ? lista.map((p, i) => {
      const v = t.val(p), subiu = anteriores[p.handle] !== undefined && v > anteriores[p.handle];
      const rei = i === 0 && COROA;
      const foto = `<span class="avw">${avatar(p)}${rei ? '<span class="coroa">👑</span>' : ""}</span>`;
      const valor = `<span class="val">${num(v)}<span class="ic">${t.ic}</span></span>`;
      return `<div class="lin ${subiu ? "subiu" : ""} ${rei ? "rei" : ""}"><span class="pos">${i + 1}</span>${foto}` +
        (LAYOUT === "compacto" ? `<span class="info"><span class="nome">${esc(p.nome)}</span>${valor}</span>` : `<span class="nome">${esc(p.nome)}</span>${valor}`) + `</div>`;
    }).join("") : `<div class="vazio">Ainda ninguém por aqui… seja o primeiro! ✨</div>`}</div></div>`;
  lista.forEach(p => anteriores[p.handle] = t.val(p));
}

// ---------------- Metas ----------------
const QUAIS = (P.get("quais") || "todas").toLowerCase();
const INFO_META = {curtidas: ["❤️", "curtidas", d => d.total_curtidas], seguidores: ["👥", "seguidores", d => d.seguidores_total],
                   diamantes: ["💎", "diamantes", d => d.total_diamantes]};
function blocoMeta(tipo, metas, d) {
  const [emo, nome, tot] = INFO_META[tipo], total = tot(d);
  if (!metas.length || total == null) return "";
  const prox = metas.find(m => !m.batida && m.valor > total);
  const alvo = prox ? prox.valor : metas[metas.length - 1].valor;

// ---------------- Pote de avatares (física com Matter.js) ----------------
// &recipiente=pote|aquario|chao  &gatilhos=seguir,heart,presente,compartilhar  &diamantes=1 (mínimo do presente)
// &grande=100 (diamantes para a foto ficar grande)  &limite=80  &cheio=sumir|transbordar  &nomes=1
const PT = {
  recipiente: ["pote", "aquario", "chao"].includes(P.get("recipiente")) ? P.get("recipiente") : "pote",
  gatilhos: (P.get("gatilhos") || "seguir,heart,presente").toLowerCase().split(","),
  minDiamantes: Math.max(1, Number(P.get("diamantes")) || 1),
  grande: Math.max(1, Number(P.get("grande")) || 100),
  limite: Math.max(10, Math.min(200, Number(P.get("limite")) || 80)),
  cheio: P.get("cheio") === "transbordar" ? "transbordar" : "sumir",
  nomes: P.get("nomes") !== "0",

const COR_TIPO = {seguir: "#fe2c55", heart: "#ff7aa2", presente: "#ffc83d", compartilhar: "#25f4ee"};
let pote = null;   // {engine, W, H, paredes, fundo, corpos: Map(id -> {body, ...}), vistos, fila, esvaziando}
const CHAVE_ESV = "pdl-pote-esvaziado-" + PT.recipiente;
function lerEsvaziado() { try { return Number(localStorage.getItem(CHAVE_ESV)) || 0; } catch (e) { return 0; } }
function gravarEsvaziado(v) { try { localStorage.setItem(CHAVE_ESV, String(v)); } catch (e) {} }

function perfilPote(cx, jw, jh, base) {
  // Pote de boca larga (sem tampa): rosca curta, ombro pequeno, corpo reto com friso
  // e a parte de baixo afinando até a base oval. Contorno da metade direita, de cima para baixo.
  const bw = jw / 2, nw = bw * .87, bb = bw * .8, topo = base - jh;
  const yG = topo + jh * .15, yO = yG + jh * .06, yF = topo + jh * .7, yC = yF + jh * .05;
  const meio = [[nw, topo], [nw, yG]];
  for (let k = 1; k <= 8; k++) { const a = k / 8 * Math.PI / 2; meio.push([nw + (bw - nw) * Math.sin(a), yG + (yO - yG) * (1 - Math.cos(a))]); }
  meio.push([bw, yF], [bw * .985, yF + jh * .012], [bw, yC]);           // friso
  for (let k = 1; k <= 12; k++) {                                       // afina até a base
    const f = k / 12, x = bw - (bw - bb) * Math.pow(f, 1.6), y = yC + (base - yC) * f;
    meio.push([x, y]);
  }
  meio.push([0, base]);
  return {cx, jw, jh, base, topo, bw, nw, bb, yG, yO, yF, yC, rb: 0, meio};
}
function caminhoPote(c, j) {
  c.beginPath();
  c.moveTo(j.cx + j.meio[0][0], j.meio[0][1]);
  j.meio.forEach(([x, y]) => c.lineTo(j.cx + x, y));
  [...j.meio].reverse().forEach(([x, y]) => c.lineTo(j.cx - x, y));
  c.closePath();
}
function iniciarPote() {
  document.body.classList.add("pote");
  const cv = document.createElement("canvas"); cv.id = "tela-pote"; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const {Engine, Bodies, Composite} = Matter;
  const engine = Engine.create({gravity: {x: 0, y: 1}});
  const est = {isStatic: true, friction: 0.3, restitution: 0.2};
  const esc = Number(getComputedStyle(document.documentElement).getPropertyValue("--escala")) || 1;
  const g = {W, H, ctx, engine, corpos: new Map(), vistos: new Set(), fila: [], esvaziando: false, cortado: lerEsvaziado()};
  g.raio = Math.max(12, Math.min(W, H) * 0.045 * esc);
  const fundo = [], lados = [];
  if (PT.recipiente === "chao") {
    fundo.push(Bodies.rectangle(W / 2, H + 25, W * 2, 50, est));
    lados.push(Bodies.rectangle(-25, H / 2, 50, H * 4, est), Bodies.rectangle(W + 25, H / 2, 50, H * 4, est));
    g.boca = [g.raio, W - g.raio];
  } else if (PT.recipiente === "pote") {
    // pote de vidro sem tampa: gargalo com rosca, ombros arredondados, corpo largo, fundo arredondado
    const jw = Math.min(W * .9, H * .82), jh = Math.min(H * .9, jw * 1.05), cx = W / 2, base = H - 14, e = 26;
    g.jar = perfilPote(cx, jw, jh, base);
    const meio = g.jar.meio, fundoY = base - 2;
    const pecas = (pts, sinal) => {
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
        if (L < .5) continue;
        const nx = sinal * dy / L, ny = sinal * -dx / L;   // normal para fora do pote
        const peca = Bodies.rectangle((x1 + x2) / 2 + nx * e / 2, (y1 + y2) / 2 + ny * e / 2, L + 3, e, {...est, angle: Math.atan2(dy, dx)});
        (y1 >= fundoY && y2 >= fundoY ? fundo : lados).push(peca);
      }
    };
    pecas(meio.map(([x, y]) => [cx + x, y]), 1);           // lado direito
    pecas(meio.map(([x, y]) => [cx - x, y]), -1);          // lado esquerdo (espelhado)
    g.boca = [cx - g.jar.nw + g.raio + 6, cx + g.jar.nw - g.raio - 6];
  } else {   // aquário redondo: arco de pedacinhos, aberto em cima
    const R = Math.min(W * .47, H * .46), cx = W / 2, cy = H - R - 14, e = 22;
    g.aq = {cx, cy, R};
    for (let a = -40; a <= 220; a += 5) {
      const r = a * Math.PI / 180, x = cx + Math.cos(r) * (R + e / 2), y = cy + Math.sin(r) * (R + e / 2);
      const peca = Bodies.rectangle(x, y, e, 2 * Math.PI * R / 72 + 6, {...est, angle: r});
      (a > 30 && a < 150 ? fundo : lados).push(peca);
    }
    g.boca = [cx - R * .55, cx + R * .55];
  }
  Composite.add(engine.world, [...fundo, ...lados]);
  g.fundo = fundo;
  pote = g;
  requestAnimationFrame(desenharPote);
}

function tamanhoDe(item) {
  if (item.tipo !== "presente") return 1;
  return item.diamantes >= PT.grande ? 1.7 : 1.25;
}
function soltarNoPote(item, instantaneo) {
  const {Bodies, Composite, Body} = Matter, g = pote;
  const k = tamanhoDe(item), r = g.raio * k;
  const x = g.boca[0] + Math.random() * Math.max(1, g.boca[1] - g.boca[0]);
  const y = instantaneo ? g.H * .1 - Math.random() * g.H * 1.2 : -r - 10;
  const body = Bodies.circle(x, y, r, {restitution: .35, friction: .06, frictionAir: .012, density: .002});
  Body.setAngularVelocity(body, (Math.random() - .5) * .2);
  const img = new Image(); img.referrerPolicy = "no-referrer";
  const dado = {body, item, r, k, img, ok: false, nasceu: instantaneo ? 0 : performance.now(), alpha: 1, saindo: false};
  if (item.foto) { img.onload = () => dado.ok = true; img.src = item.foto; }
  g.corpos.set(item.handle + "|" + item.tipo, dado);
  Composite.add(g.engine.world, body);
  limitarPote();
}
function limitarPote() {
  const g = pote, vivos = [...g.corpos.values()].filter(c => !c.saindo);
  if (vivos.length <= PT.limite) return;
  if (PT.cheio === "transbordar") return esvaziarPote();
  vivos.sort((a, b) => a.item.t - b.item.t).slice(0, vivos.length - PT.limite).forEach(c => c.saindo = true);   // as mais antigas somem devagar
}
function esvaziarPote() {
  const g = pote;
  if (g.esvaziando) return;
  g.esvaziando = true;
  Matter.Composite.remove(g.engine.world, g.fundo);   // o fundo abre e tudo cai
  setTimeout(() => {
    g.corpos.forEach(c => Matter.Composite.remove(g.engine.world, c.body));
    g.corpos.clear();
    Matter.Composite.add(g.engine.world, g.fundo);
    g.cortado = Date.now() / 1000; gravarEsvaziado(g.cortado);
    g.esvaziando = false;
  }, 2600);
}
function poteReceber(lista) {
  if (!pote) iniciarPote();
  const g = pote, primeira = g.vistos.size === 0 && !g.carregou;
  if (primeira) {   // ao abrir: só as mais recentes que cabem (sem transbordar nem sumir de cara)
    const validos = lista.filter(i => PT.gatilhos.includes(i.tipo) && !(i.tipo === "presente" && i.diamantes < PT.minDiamantes) && i.t > g.cortado);
    const fora = new Set(validos.slice(0, Math.max(0, validos.length - (PT.limite - 1))).map(i => i.handle + "|" + i.tipo));
    fora.forEach(k => g.vistos.add(k));
  }
  for (const item of lista) {
    if (!PT.gatilhos.includes(item.tipo)) continue;
    if (item.tipo === "presente" && item.diamantes < PT.minDiamantes) continue;
    if (item.t <= g.cortado) continue;
    const chave = item.handle + "|" + item.tipo;
    const ja = g.corpos.get(chave);
    if (ja) {   // presente de novo: a foto cresce se passou do limite de "grande"
      ja.item.foto = ja.item.foto || item.foto;
      if (item.foto && !ja.ok && !ja.img.src) { ja.img.onload = () => ja.ok = true; ja.img.src = item.foto; }
      const k = tamanhoDe(item);
      if (k > ja.k) { Matter.Body.scale(ja.body, k / ja.k, k / ja.k); ja.r = g.raio * k; ja.k = k; ja.item.diamantes = item.diamantes; ja.nasceu = performance.now(); }
      continue;
    }
    if (g.vistos.has(chave)) continue;
    g.vistos.add(chave);
    if (primeira) soltarNoPote(item, true); else g.fila.push(item);
  }
  if (primeira) {   // recarregou a página: o pote se recompõe na hora
    for (let i = 0; i < 360; i++) Matter.Engine.update(g.engine, 1000 / 60);
    g.carregou = true;
  }
}
setInterval(() => { if (pote && !pote.esvaziando && pote.fila.length) soltarNoPote(pote.fila.shift(), false); }, 380);

function desenharRecipienteAtras(g) {
  const c = g.ctx;
  if (g.jar) {
    const j = g.jar, grad = c.createLinearGradient(j.cx - j.bw, 0, j.cx + j.bw, 0);
    grad.addColorStop(0, "rgba(255,255,255,.20)"); grad.addColorStop(.25, "rgba(235,242,255,.07)");
    grad.addColorStop(.6, "rgba(200,215,240,.05)"); grad.addColorStop(1, "rgba(255,255,255,.18)");
    caminhoPote(c, j); c.fillStyle = grad; c.fill();
    c.lineWidth = 2; c.strokeStyle = "rgba(255,255,255,.28)";   // fundo oval (efeito 3D)
    c.beginPath(); c.ellipse(j.cx, j.base - j.jh * .045, j.bb * .92, j.jh * .045, 0, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.ellipse(j.cx, j.topo + 3, j.nw, j.jh * .03, 0, Math.PI, Math.PI * 2); c.stroke();   // fundo da boca (lado de trás)
  } else if (g.aq) {
    const {cx, cy, R} = g.aq;
    const grad = c.createRadialGradient(cx - R * .3, cy - R * .3, R * .2, cx, cy, R * 1.05);
    grad.addColorStop(0, "rgba(140,240,255,.10)"); grad.addColorStop(1, "rgba(var(--ciano-rgb),.22)");
    c.fillStyle = grad; c.beginPath(); c.arc(cx, cy, R + 10, 0, Math.PI * 2); c.fill();
    c.save(); c.beginPath(); c.arc(cx, cy, R + 10, 0, Math.PI * 2); c.clip();
    c.fillStyle = "rgba(37,180,238,.18)"; c.fillRect(cx - R - 12, cy - R * .35, 2 * R + 24, 2 * R);   // água
    const t = performance.now() / 1000;
    c.fillStyle = "rgba(255,255,255,.55)";
    for (let i = 0; i < 9; i++) {   // bolhinhas
      const bx = cx - R * .7 + ((i * 97) % (R * 1.4)), by = cy + R - ((t * 40 + i * 53) % (R * 1.3));
      c.beginPath(); c.arc(bx, by, 2 + (i % 3), 0, Math.PI * 2); c.fill();

}
function desenharRecipienteFrente(g) {
  const c = g.ctx;
  c.lineWidth = 6; c.strokeStyle = "rgba(255,255,255,.75)"; c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = 8;
  if (g.jar) {
    const j = g.jar;
    c.lineWidth = 4; c.strokeStyle = "rgba(255,255,255,.8)";
    caminhoPote(c, j); c.stroke();
    c.shadowBlur = 0;
    // boca (elipse da frente) e roscas inclinadas
    c.lineWidth = 4; c.strokeStyle = "rgba(255,255,255,.85)";
    c.beginPath(); c.ellipse(j.cx, j.topo + 3, j.nw, j.jh * .03, 0, 0, Math.PI); c.stroke();
    c.lineWidth = 2.5; c.strokeStyle = "rgba(255,255,255,.5)"; c.lineCap = "round";
    const hR = j.yG - j.topo;
    for (const f of [.3, .55, .8]) {
      const y = j.topo + hR * f;
      c.beginPath(); c.moveTo(j.cx - j.nw + 2, y + hR * .12); c.quadraticCurveTo(j.cx, y + hR * .02, j.cx + j.nw - 2, y - hR * .08); c.stroke();
    }
    c.beginPath(); c.moveTo(j.cx - j.nw, j.yG); c.quadraticCurveTo(j.cx, j.yG + 6, j.cx + j.nw, j.yG); c.stroke();
    // friso da parte de baixo
    c.lineWidth = 2.5; c.strokeStyle = "rgba(255,255,255,.45)";
    c.beginPath(); c.moveTo(j.cx - j.bw + 3, j.yF + j.jh * .006); c.quadraticCurveTo(j.cx, j.yF + j.jh * .03, j.cx + j.bw - 3, j.yF + j.jh * .006); c.stroke();
    // reflexos do vidro
    const lg = c.createLinearGradient(0, j.yO + 10, 0, j.yF);
    lg.addColorStop(0, "rgba(255,255,255,.45)"); lg.addColorStop(1, "rgba(255,255,255,.05)");
    c.fillStyle = lg;
    c.beginPath(); c.roundRect(j.cx - j.bw + 12, j.yO + 12, 10, (j.yF - j.yO) * .85, 5); c.fill();
    c.beginPath(); c.roundRect(j.cx + j.bw - 22, j.yO + 12, 7, (j.yF - j.yO) * .6, 4); c.fill();
    c.fillStyle = "rgba(255,255,255,.18)";
    c.beginPath(); c.roundRect(j.cx - j.bw * .35, j.yO + 14, j.bw * .7, 6, 3); c.fill();
    c.lineCap = "butt";
  } else if (g.aq) {
    const {cx, cy, R} = g.aq;
    c.beginPath(); c.arc(cx, cy, R + 10, -50 * Math.PI / 180, 230 * Math.PI / 180); c.stroke();
    c.shadowBlur = 0; c.fillStyle = "rgba(255,255,255,.22)";
    c.beginPath(); c.ellipse(cx - R * .55, cy - R * .1, 9, R * .38, .35, 0, Math.PI * 2); c.fill();
  }
  c.shadowBlur = 0;
}
function desenharPote() {
  const g = pote, c = g.ctx, agora = performance.now();
  Matter.Engine.update(g.engine, 1000 / 60);
  c.clearRect(0, 0, g.W, g.H);
  desenharRecipienteAtras(g);
  for (const [chave, d] of g.corpos) {
    const b = d.body, {x, y} = b.position;
    if (d.saindo) { d.alpha -= .02; if (d.alpha <= 0) { Matter.Composite.remove(g.engine.world, b); g.corpos.delete(chave); continue; } }
    if (y > g.H + 300) { Matter.Composite.remove(g.engine.world, b); g.corpos.delete(chave); continue; }
    const r = d.r, cor = COR_TIPO[d.item.tipo] || "#fff";
    c.save(); c.globalAlpha = d.alpha; c.translate(x, y); c.rotate(b.angle);
    if (d.k >= 1.7) { c.shadowColor = "#ffc83d"; c.shadowBlur = 18; }
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fillStyle = cor; c.fill(); c.shadowBlur = 0;
    c.save(); c.beginPath(); c.arc(0, 0, r - 3, 0, Math.PI * 2); c.clip();
    if (d.ok) c.drawImage(d.img, -r + 3, -r + 3, 2 * r - 6, 2 * r - 6);
    else {
      const gr = c.createLinearGradient(-r, -r, r, r); gr.addColorStop(0, "#25f4ee"); gr.addColorStop(1, "#fe2c55");
      c.fillStyle = gr; c.fillRect(-r, -r, 2 * r, 2 * r);
      c.fillStyle = "#fff"; c.font = `900 ${r * .9}px "TikTok Sans", Inter, Arial`; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText((d.item.nome || "?").trim()[0]?.toUpperCase() || "?", 0, r * .06);
    }
    c.restore(); c.restore();
    const idade = (agora - d.nasceu) / 1000;
    if (PT.nomes && d.nasceu && idade < 3.2) {   // nome aparece enquanto cai
      c.save(); c.globalAlpha = Math.min(1, (3.2 - idade) / .6);
      c.font = `800 ${Math.max(12, g.raio * .55)}px "TikTok Sans", Inter, Arial`; c.textAlign = "center";
      c.lineWidth = 4; c.strokeStyle = "rgba(0,0,0,.85)"; c.fillStyle = "#fff";
      const txt = (d.item.tipo === "presente" ? "🎁 " : d.item.tipo === "heart" ? "💗 " : d.item.tipo === "compartilhar" ? "🔁 " : "💖 ") + d.item.nome;
      c.strokeText(txt, x, y - r - 8); c.fillText(txt, x, y - r - 8); c.restore();
    }
  }
  desenharRecipienteFrente(g);
  requestAnimationFrame(desenharPote);
}
if (TIPO === "pote") {
  const s = document.createElement("script");
  s.src = API ? "matter.min.js" : "/matter.min.js";   // no GitHub Pages fica ao lado desta página
  s.onload = () => atualizar();
  document.head.appendChild(s);
}

// ---------------- Teste: dados de exemplo para ver o visual antes da live ----------------
const TESTE_FIXO = P.get("teste") === "1";
let emTeste = false, inicioTeste = Date.now();
const NOMES_TESTE = ["Maria Clara", "João Pedro", "Ana Paula", "Pastor Marcos", "Lúcia Helena", "Carlos Eduardo", "Fernanda", "Rafael", "Juliana", "Tia Rose"];
function dadosTeste() {
  const t = (Date.now() - inicioTeste) / 1000, agora = Date.now() / 1000;
  const lista = (base, ritmo) => NOMES_TESTE.map((nome, i) => ({handle: "teste" + i, nome, foto: "",
    v: Math.round(base[i] + t * ritmo[i])})).sort((a, b) => b.v - a.v);
  const cur = lista([980, 860, 900, 640, 520, 480, 300, 260, 180, 90], [9, 14, 6, 11, 4, 8, 3, 5, 2, 7]);
  const pre = lista([520, 300, 240, 199, 150, 99, 60, 30, 15, 5], [2, 4, 1, 3, 0, 2, 1, 0, 1, 0]);
  const com = lista([14, 11, 9, 7, 6, 4, 3, 2, 2, 1], [.08, .12, .05, .06, .03, .04, .02, .03, .01, .02]);
  const soma = l => l.reduce((a, p) => a + p.v, 0);
  const ciclo = t % 70, fimBat = ciclo >= 60;
  const nos = Math.round(800 + ciclo * 95), eles = Math.round(1100 + ciclo * 70);
  const tiposA = ["seguir", "presente", "compartilhar", "heart", "meta", "batalha_inicio"];
  const nA = Math.floor(t / 3) + 1, alertas = [];
  for (let k = Math.max(1, nA - 4); k <= nA; k++) {
    const tipo = tiposA[k % tiposA.length], nome = NOMES_TESTE[k % 10];
    alertas.push({id: k, tipo, nome, handle: "teste" + (k % 10), qtd: 5, presente: "Rosa", valor: 5000, meta_tipo: "curtidas", adversario: "Irmã Cida"});
  }
  const tiposP = ["seguir", "presente", "heart", "compartilhar"], nP = Math.min(45, Math.floor(t / 1.2) + 6), pote = [];
  for (let k = 0; k < nP; k++)
    pote.push({handle: "teste" + k, tipo: tiposP[k % 4], nome: NOMES_TESTE[k % 10] + (k >= 10 ? " " + (k + 1) : ""), foto: "",
               diamantes: k % 4 === 1 ? (k % 3 ? 5 : 150) : 0, t: inicioTeste / 1000 + k * 1.2});
  return {
    nome: "Sua live",
    top_curtidas: cur.map(p => ({...p, total: p.v})), total_curtidas: soma(cur) + 12500,
    top_presentes: pre.map(p => ({...p, diamantes: p.v})), total_diamantes: soma(pre),
    top_compart: com.map(p => ({...p, total: p.v})), total_compart: soma(com),
    metas: [{tipo: "curtidas", valor: 15000}, {tipo: "curtidas", valor: 30000}, {tipo: "seguidores", valor: 1300}, {tipo: "diamantes", valor: 2000}],
    seguidores_total: 1240 + Math.floor(t / 4),
    meta_tiktok: {subs: [{presente: "Rosa", icone: "", alvo: 30, progresso: Math.min(30, 12 + Math.floor(t / 3))}], expira: 0},
    batalha: {status: fimBat ? "fim" : "andamento", restante: Math.max(0, 60 - Math.floor(ciclo)), nos, eles, adversario: "Irmã Cida",
              resultado: nos > eles ? "vitoria" : "derrota", missao_ativa: ciclo > 40 && !fimBat,
              ajudantes_nos: [{nome: "Maria Clara", pontos: Math.round(nos * .4)}, {nome: "João Pedro", pontos: Math.round(nos * .25)}, {nome: "Tia Rose", pontos: Math.round(nos * .1)}]},
    alertas, pote,

}
function seloTeste(ligar) {

// ---------------- laço ----------------
async function atualizar() {

setInterval(atualizar, TIPO === "alertas" || TIPO === "videos" ? 700 : 1500);
