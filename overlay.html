<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>XLiv · Overlay</title>
<link rel="icon" type="image/png" href="/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@500..900&display=swap" rel="stylesheet">
<!--
  Overlays para OBS / TikTok LIVE Studio (fonte "Navegador" / "Link"), fundo transparente.
  Endereço:  /overlay/<tipo>?estilo=painel|limpo&top=10&escala=1&titulo=1
  Tops:      &layout=compacto|lado (quantidade embaixo ou ao lado do nome)  &coroa=0 (tira a coroa do 1º)
  Teste:     &teste=1 mostra dados de exemplo (para ver o visual antes da live)
  Cores:     &cor=ffffff (texto)  &destaque=tiktok|ffc83d (bordas, barras, números)  &efeito=sombra|contorno|neon|nenhum
             &fundo=escuro|claro|transparente  &opacidade=0..100  &pulsar=1  &brilho=1  &confete=1
  Fonte:     &fonte=Poppins (ver FONTES abaixo)
  Pote:      &cai=foto|presente|ambos (nos presentes: foto da pessoa, imagem do presente ou foto com o presente no cantinho)
  Vídeos:    /overlay/videos  (toca o vídeo escolhido para cada momento; &mudo=1 tira o som)
  Tipos:     curtidas · presentes · compartilhamentos · metas · batalha · alertas
  metas:     &quais=todas|curtidas|seguidores|diamantes|tiktok  &formato=circulo  &direcao=coluna (círculos) | lado (barras)
  galeria:   &direcao=horizontal|vertical  &visiveis=4  &tempo=3  &so_apagados=1
  alertas:   &tipos=seguir,compartilhar,heart,presente,metas,batalha&duracao=5
-->
<style>
  :root{--rosa:#fe2c55;--ciano:#25f4ee;--rosa-rgb:254,44,85;--ciano-rgb:37,244,238;--ouro:#ffc83d;--roxo:#8a5cf6;--ok:#3ddc84;
        --card:rgba(18,18,26,.86);--linha:rgba(255,255,255,.12);--ink:#fff;--muted:rgba(255,255,255,.72)}
  html{font-size:calc(16px * var(--escala, 1))}
  html,body{margin:0;background:transparent;overflow:hidden}
  body.palco #raiz{position:fixed;inset:0;overflow:hidden}
  #palco-stage{position:absolute;top:0;left:0;transform-origin:top left}
  .palco-peca{position:absolute;border:0;background:transparent;overflow:hidden}
  body{font-family:var(--fonte, "TikTok Sans"),"TikTok Sans",Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:.75rem}
  *{box-sizing:border-box}
  .some{display:none!important}

  /* ---------- estilo PAINEL (cartão escuro, rosa e ciano) ---------- */
  .painel .caixa{background:var(--card);border:2px solid rgba(var(--rosa-rgb),.55);border-radius:1.25rem;padding:.9rem 1rem 1rem;
    box-shadow:0 .5rem 1.6rem rgba(0,0,0,.35);backdrop-filter:blur(6px);width:23rem}
  .painel .tit{font-weight:900;font-size:1.15rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.45rem;letter-spacing:.02em}
  .painel .tit small{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:700}
  .painel .lin{display:grid;grid-template-columns:1.9rem 2.3rem 1fr auto;align-items:center;gap:.55rem;padding:.38rem .2rem;
    border-bottom:1px solid var(--linha);transition:background .4s}
  .painel .lin:last-child{border-bottom:0}
  .painel .pos{width:1.8rem;height:1.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;
    background:rgba(255,255,255,.1)}
  .painel .lin:nth-child(1) .pos{background:linear-gradient(#ffe27a,#f5a300);color:#3a2600}
  .painel .lin:nth-child(2) .pos{background:linear-gradient(#f2f2f2,#b9b9c4);color:#222}
  .painel .lin:nth-child(3) .pos{background:linear-gradient(#f0b27a,#c06a2b);color:#2b1300}
  .painel .av{width:2.3rem;height:2.3rem;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--ciano),var(--rosa));
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;border:2px solid rgba(255,255,255,.35)}
  .painel .nome{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .painel .val{font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .painel .vazio{color:var(--muted);font-size:.95rem;padding:.4rem .2rem}

  /* ---------- estilo NEON (cada pessoa num cartão com borda neon; cores trocando) ---------- */
  /* usa o estilo PAINEL como base (body com as duas classes) e muda o que precisa */
  .neon{--neon:#ff2d95}
  .neon .caixa{background:transparent;border:0;box-shadow:none;backdrop-filter:none;padding:.3rem .45rem}
  .neon .tit{padding:0 .2rem}
  .neon .lin{position:relative;border:0!important;margin:.55rem 0;padding:.5rem .7rem!important;border-radius:.9rem;
    background:var(--card-neon, rgba(10,10,22,.8));isolation:isolate}
  .neon .lin::before{content:"";position:absolute;inset:0;border-radius:inherit;border:.16rem solid var(--cor-lin, var(--neon));
    box-shadow:0 0 .45rem var(--cor-lin, var(--neon)),0 0 1.1rem var(--cor-lin, var(--neon)),inset 0 0 .5rem var(--cor-lin, var(--neon));
    z-index:-1;pointer-events:none}
  .neon .lin.rei{padding-top:.9rem!important;margin-top:1.1rem}
  /* número da posição: &numero=medalha|losango|escudo|placar|hexagono */
  body.numfmt .lin .pos{--pos-cor:#3a3a4a;--pos-cor2:#1f1f29;--pos-txt:#fff;color:var(--pos-txt);text-shadow:none;font-weight:900;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:.95rem;isolation:isolate}
  body.numfmt .lin:nth-child(1) .pos{--pos-cor:#ffe27a;--pos-cor2:#e89400;--pos-txt:#3a2600;--pos-brilho:#ffc83d}
  body.numfmt .lin:nth-child(2) .pos{--pos-cor:#ffffff;--pos-cor2:#a9b1bf;--pos-txt:#222;--pos-brilho:#e8eef6}
  body.numfmt .lin:nth-child(3) .pos{--pos-cor:#ffc08a;--pos-cor2:#c9561f;--pos-txt:#2b1300;--pos-brilho:#ff8a3d}
  /* MEDALHA: moeda com aro e fitinha */
  body.numfmt.num-medalha .lin .pos{width:1.9rem;height:1.9rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--pos-cor),var(--pos-cor2));
    box-shadow:inset 0 0 0 .14rem rgba(255,255,255,.45),0 .1rem .3rem rgba(0,0,0,.5);margin-bottom:.35rem}
  body.numfmt.num-medalha .lin .pos::after{content:"";position:absolute;left:50%;bottom:-.5rem;width:1rem;height:.62rem;transform:translateX(-50%);z-index:-1;
    background:var(--cor-lin, var(--neon));clip-path:polygon(0 0,100% 0,100% 100%,50% 62%,0 100%)}
  /* LOSANGO: quadrado em pé, como um diamante */
  body.numfmt.num-losango .lin .pos{width:2.15rem;height:2.15rem;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
    background:linear-gradient(160deg,var(--pos-cor),var(--pos-cor2))}
  /* ESCUDO: brasão com a ponta para baixo */
  body.numfmt.num-escudo .lin .pos{width:1.85rem;height:2.1rem;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);border-radius:.25rem .25rem 0 0;
    background:linear-gradient(180deg,var(--pos-cor),var(--pos-cor2));padding-bottom:.25rem}
  /* HEXÁGONO */
  body.numfmt.num-hexagono .lin .pos{width:1.85rem;height:2.05rem;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(var(--pos-cor),var(--pos-cor2))}
  /* PLACAR: só o número grande, em neon, sem forma em volta */
  body.numfmt.num-placar .lin .pos{background:none;width:auto;height:auto;font-size:1.55rem;font-style:italic;letter-spacing:-.05em;
    color:var(--pos-brilho, #fff);text-shadow:0 0 .35rem var(--pos-brilho, var(--neon)),0 0 .8rem var(--pos-brilho, var(--neon))!important}
  body.numfmt.num-placar .lin .pos::after{content:"º";font-size:.55em;vertical-align:super}
  .neon .av{border:.14rem solid var(--cor-lin, var(--neon))!important;box-shadow:0 0 .45rem var(--cor-lin, var(--neon))}
  .neon .lin.rei .av{border-color:var(--ouro)!important}
  .neon .meta, .neon .batalha, .neon .alerta{border:.16rem solid var(--neon)!important;box-shadow:0 0 .5rem var(--neon),0 0 1.2rem var(--neon)!important}
  /* cores trocando: só a cor do neon gira pelo arco-íris (fotos e textos não mudam); cada linha um pouco atrasada */
  @property --neon-h{syntax:"<number>";inherits:true;initial-value:330}
  .neon-trocando .lin, .neon-trocando .meta, .neon-trocando .batalha, .neon-trocando .alerta, .neon-trocando .gl-card{
    --neon:hsl(var(--neon-h) 100% 62%);animation:neonGira 4s linear infinite;animation-delay:calc(var(--fase4, 0s) - var(--atraso, 0s))}
  @keyframes neonGira{to{--neon-h:690}}
  .neon-trocando .alerta{animation:entra .55s cubic-bezier(.2,1.4,.4,1) both, neonGira 4s linear infinite;animation-delay:0s, var(--fase4, 0s)}
  /* no neon, quando o número sobe: só o número dá um pulinho (a linha não pisca) */
  .neon-trocando .lin.subiu{animation:neonGira 4s linear infinite;animation-delay:calc(var(--fase4, 0s) - var(--atraso, 0s))}
  .neon-podio .lin.subiu, .neon-unica .lin.subiu{animation:none}
  .neon .lin.subiu .val{animation:pulaVal .7s ease-out}
  @keyframes pulaVal{40%{transform:scale(1.25)}}
  .neon-trocando .lin:nth-child(2){--atraso:0.4s}
  .neon-trocando .lin:nth-child(3){--atraso:0.8s}
  .neon-trocando .lin:nth-child(4){--atraso:1.2s}
  .neon-trocando .lin:nth-child(5){--atraso:1.6s}
  .neon-trocando .lin:nth-child(6){--atraso:2.0s}
  .neon-trocando .lin:nth-child(7){--atraso:2.4s}
  .neon-trocando .lin:nth-child(8){--atraso:2.8s}
  .neon-trocando .lin:nth-child(9){--atraso:3.2s}
  .neon-trocando .lin:nth-child(10){--atraso:3.6s}
  /* pódio: ouro, prata, bronze e o resto na cor de destaque */
  .neon-podio .lin:nth-child(1){--cor-lin:#ffc83d} .neon-podio .lin:nth-child(2){--cor-lin:#e8eef6} .neon-podio .lin:nth-child(3){--cor-lin:#ff8a3d}
  .neon-podio .lin{--cor-lin:var(--rosa)}
  .neon-unica{--neon:var(--rosa)}

  /* ---------- estilo LIMPO (só texto com sombra, direto sobre o vídeo) ---------- */
  .limpo .caixa{width:23rem}
  .limpo, .limpo *{text-shadow:0 0 .25rem #000,0 .1rem .35rem rgba(0,0,0,.9),0 0 .1rem #000}
  .limpo .tit{font-weight:900;font-size:1.2rem;margin:0 0 .4rem;display:flex;gap:.45rem;align-items:center;letter-spacing:.03em;text-transform:uppercase}
  .limpo .tit small{margin-left:auto;font-size:.85rem;opacity:.9}
  .limpo .lin{display:grid;grid-template-columns:1.6rem 2rem 1fr auto;align-items:center;gap:.5rem;padding:.22rem 0}
  .limpo .pos{font-weight:900;font-size:1.05rem;text-align:center}
  .limpo .lin:nth-child(1) .pos{color:#ffd54a} .limpo .lin:nth-child(2) .pos{color:#e6e6ee} .limpo .lin:nth-child(3) .pos{color:#f0a868}
  .limpo .av{width:2rem;height:2rem;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 .3rem rgba(0,0,0,.8);
    background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem}
  .limpo .nome{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .limpo .val{font-weight:900;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .limpo .vazio{opacity:.85;font-size:.95rem}
  /* formato do número nos visuais Painel e Limpo: um pouco mais de espaço para a forma */
  body.numfmt:not(.neon){--neon:var(--rosa)}
  body.numfmt:not(.neon) .lin{grid-template-columns:2.2rem 2.3rem 1fr auto}
  body.numfmt:not(.neon) .compacto .lin{grid-template-columns:2.2rem 2.5rem 1fr}
  .limpo.numfmt .lin .pos{box-shadow:0 .1rem .35rem rgba(0,0,0,.7)}

  /* ---------- Tops compactos: quantidade embaixo do nome ---------- */
  .painel .caixa.compacto{width:17rem;padding:.8rem .85rem .85rem}
  .limpo .caixa.compacto{width:16rem}
  .compacto .tit{flex-wrap:wrap;row-gap:.1rem}
  .compacto .lin{grid-template-columns:1.6rem 2.5rem 1fr;gap:.5rem}
  .painel .compacto .lin{padding:.32rem .15rem}
  .info{display:flex;flex-direction:column;min-width:0;line-height:1.15}
  .compacto .nome{font-size:.98rem}
  .compacto .val{font-size:.88rem;font-weight:800}
  .painel .compacto .val{color:var(--ciano)}
  .painel .compacto .lin:nth-child(1) .val{color:var(--ouro)}
  .avw{position:relative;display:inline-flex;justify-self:center}
  .coroa{position:absolute;left:50%;top:-1.05rem;transform:translateX(-50%) rotate(-10deg);font-size:1.25rem;line-height:1;
    filter:drop-shadow(0 .1rem .15rem rgba(0,0,0,.7));animation:brilha 2.4s ease-in-out infinite;animation-delay:var(--fase24, 0s)}
  @keyframes brilha{50%{transform:translateX(-50%) rotate(-10deg) translateY(-.12rem)}}
  .lin.rei{padding-top:1rem!important}
  .lin.rei .av{border-color:var(--ouro)!important;box-shadow:0 0 .55rem rgba(255,200,61,.75)}
  .selo-teste{position:fixed;top:.3rem;right:.3rem;z-index:9;background:var(--ouro);color:#2a1d00;font:900 .75rem "TikTok Sans",Arial,sans-serif;
    padding:.15rem .5rem;border-radius:99px;text-shadow:none!important;letter-spacing:.04em}

  /* ---------- cores e efeitos escolhidos ---------- */
  body.ef-contorno, body.ef-contorno *{text-shadow:-.07rem -.07rem 0 #000,.07rem -.07rem 0 #000,-.07rem .07rem 0 #000,.07rem .07rem 0 #000,0 .1rem .3rem rgba(0,0,0,.8)!important}
  body.ef-neon, body.ef-neon *{text-shadow:0 0 .2rem var(--brilho-cor),0 0 .55rem var(--brilho-cor),0 0 1rem var(--brilho-cor)!important}
  body.ef-nenhum, body.ef-nenhum *{text-shadow:none!important}
  body.ef-sombra.painel *{text-shadow:0 .08rem .25rem rgba(0,0,0,.55)}
  body.fundo-transparente .caixa, body.fundo-transparente .meta, body.fundo-transparente .batalha, body.fundo-transparente .alerta{backdrop-filter:none;box-shadow:none}
  /* intensidade baixa: sem desfoque nem sombra escura atrás do cartão, senão ele parece mais escuro do que foi escolhido */
  body.fundo-leve .caixa, body.fundo-leve .batalha{backdrop-filter:none;box-shadow:none}
  body.fundo-leve:not(.neon) .alerta{box-shadow:none}
  .av{color:#fff!important;text-shadow:0 .05rem .2rem rgba(0,0,0,.6)!important}
  /* cartão claro: o texto de DENTRO do cartão fica escuro (o de fora, como o título no Neon, continua como está) */
  body.tinta-auto.painel:not(.neon) .caixa, body.tinta-auto .meta, body.tinta-auto .batalha, body.tinta-auto .alerta,
  body.tinta-auto .gl-card, body.tinta-auto.neon .lin{--ink:#1c1c24;--muted:rgba(28,28,36,.72);color:var(--ink)}
  body.tinta-auto.ef-sombra:not(.neon) .caixa *, body.tinta-auto.ef-sombra .meta *, body.tinta-auto.ef-sombra .batalha *,
  body.tinta-auto.ef-sombra .alerta *, body.tinta-auto.ef-sombra .gl-card *, body.tinta-auto.ef-sombra.neon .lin *{text-shadow:none}
  body.tinta-auto .compacto .lin .val{color:var(--ink)}
  body.tinta-auto .gl-card.aceso .gl-n{color:#a86b00}
  body.limpo .caixa, body.limpo .meta, body.limpo .batalha, body.limpo .alerta{background:transparent}
  .fundo-claro .pos{background:rgba(0,0,0,.08)}
  .fundo-claro .compacto .lin:nth-child(1) .val{color:#a86b00}
  .fundo-claro .trilho{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.12)}
  .anim-pulsar .lin.rei .av{animation:pulsa1 1.6s ease-in-out infinite;animation-delay:var(--fase16, 0s)}
  @keyframes pulsa1{50%{transform:scale(1.12);box-shadow:0 0 .9rem var(--ouro)}}
  .anim-brilho .enche, .anim-brilho .bt-cabo .a, .anim-brilho .bt-br span{position:relative;overflow:hidden}
  .anim-brilho .enche::after, .anim-brilho .bt-cabo .a::after, .anim-brilho .bt-br span::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.65) 50%,transparent 80%);transform:translateX(-100%);animation:corre 2.2s ease-in-out infinite;
    animation-delay:var(--fase22, 0s)}
  @keyframes corre{60%,100%{transform:translateX(100%)}}
  .confete{position:fixed;top:-2rem;width:.6rem;height:1rem;border-radius:.15rem;z-index:20;pointer-events:none;animation:cai linear forwards}
  @keyframes cai{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

  /* ---------- vídeos dos momentos ---------- */
  body.videos{padding:0} #tela-video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:transparent}
  .video-teste{position:fixed;inset:8%;border:.25rem dashed var(--ciano);border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.4rem;font-weight:900;font-size:1.5rem;text-align:center;background:rgba(0,0,0,.35);animation:entra .5s both}
  .video-teste small{font-size:1rem;opacity:.85;font-weight:700}

  .lin.subiu{animation:subiu 1.1s ease-out}
  @keyframes subiu{0%{background:rgba(var(--rosa-rgb),.45)}100%{background:transparent}}
  .val .ic{font-size:.85em;margin-left:.15rem}

  /* ---------- metas ---------- */
  .metas{display:flex;flex-direction:column;gap:.6rem;width:23rem}
  .metas.lado{flex-direction:row;flex-wrap:nowrap;width:auto;align-items:stretch}          /* barras lado a lado */
  .metas.lado > .meta{width:17rem;flex:none}
  .metas.lado .meta .topo{flex-direction:column;gap:.1rem}        /* título numa linha, números embaixo */
  .metas.lado .meta .topo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .topo{display:flex;justify-content:space-between;gap:.5rem;font-weight:900;font-size:1rem;margin-bottom:.35rem}
  .meta .topo small{font-weight:700;color:var(--muted);white-space:nowrap}
  .trilho{height:.8rem;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
  .enche{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ciano),var(--rosa));transition:width .8s}
  .meta.seguidores .enche{background:linear-gradient(90deg,#7afcf8,var(--ciano))}
  .meta.diamantes .enche{background:linear-gradient(90deg,var(--ciano),var(--roxo))}
  .meta.tiktok .enche{background:linear-gradient(90deg,#ffe27a,#f5a300)}
  .meta.ok .enche{background:var(--ok)}
  .painel .meta{background:var(--card);border:2px solid rgba(var(--rosa-rgb),.45);border-radius:1rem;padding:.7rem .9rem .8rem}
  .painel .meta.seguidores{border-color:rgba(var(--ciano-rgb),.5)} .painel .meta.diamantes{border-color:rgba(138,92,246,.6)} .painel .meta.tiktok{border-color:rgba(255,200,61,.6)}
  .limpo .trilho{box-shadow:0 0 .4rem rgba(0,0,0,.7)}
  .mtk{display:grid;grid-template-columns:1.5rem 1fr auto;gap:.15rem .5rem;align-items:center;font-size:.92rem;margin-top:.35rem}
  .mtk img{width:1.4rem;height:1.4rem;object-fit:contain} .mtk .trilho{grid-column:2 / 4;height:.55rem}
  .mtk b{font-variant-numeric:tabular-nums}

  /* metas em círculo: anel com porcentagem, nome e 10/100 (meta do TikTok: o desenho do presente no meio) */
  .metas.circulos{flex-direction:row;flex-wrap:wrap;justify-content:center;width:auto;max-width:52rem;gap:.7rem}
  .metas.circulos.coluna{flex-direction:column;flex-wrap:nowrap;align-items:center;max-width:10rem}
  .meta.circ{width:9.2rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15rem;padding:.8rem .5rem .7rem!important;
             --cor-anel:var(--rosa)}
  .meta.circ.seguidores{--cor-anel:var(--ciano)} .meta.circ.diamantes{--cor-anel:var(--roxo)} .meta.circ.tiktok{--cor-anel:var(--ouro)}
  .meta.circ.ok{--cor-anel:var(--ok)}
  .neon .meta.circ:not(.ok){--cor-anel:var(--neon)}
  .anel{position:relative;width:6.6rem;height:6.6rem;margin-bottom:.25rem}
  .anel svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .anel circle{fill:none;stroke-width:9}
  .anel .fundo{stroke:rgba(255,255,255,.14)}
  .fundo-claro .anel .fundo{stroke:rgba(0,0,0,.1)}
  .anel .arco{stroke:var(--cor-anel);stroke-linecap:round;transition:stroke-dasharray .8s;filter:drop-shadow(0 0 .25rem var(--cor-anel))}

  return `<div class="gl-card ${i.aceso ? "aceso" : ""}" data-id="${esc(i.id)}" style="--atraso:${((k % 10) * 0.4).toFixed(1)}s">
    <div class="gl-ic">${i.imagem ? `<img src="${esc(i.imagem)}" referrerpolicy="no-referrer" onerror="this.outerHTML='🎁'">` : "🎁"}</div>
    <b>${esc(i.presente || "Presente")}</b>
    ${i.aceso ? `<span class="gl-n">${i.quem ? esc(i.quem) : "Iluminado!"}</span>`
              : `<div class="gl-barra"><i style="width:${Math.min(100, (i.melhor || 0) / Math.max(1, i.qtd) * 100)}%"></i></div><span class="gl-n">${num(i.melhor || 0)}/${num(i.qtd)}</span>`}
  </div>`;
}
function desenharGaleria(d) {
  const todos = ((d.galeria || {}).itens || []).filter(i => i.presente);
  const lista = GL_SO_FALTAM ? todos.filter(i => !i.aceso) : todos;
  const acesos = todos.filter(i => i.aceso).map(i => i.id);
  const assin = JSON.stringify(lista.map(i => [i.id, i.aceso, i.melhor, i.imagem, i.quem, i.qtd]));
  if (assin === glAssinatura && raiz.querySelector(".gl")) return;
  glAssinatura = assin;
  const novosAcesos = glAcesosAntes ? acesos.filter(id => !glAcesosAntes.includes(id)) : [];
  glAcesosAntes = acesos;
  if (!lista.length) { raiz.innerHTML = ""; glN = 0; return; }
  glN = lista.length;
  const roda = glN > GL_VIS;                                      // cabe tudo? fica parado
  if (glIdx >= glN) glIdx = 0;
  const cards = lista.map(cardGaleria).join("");
  raiz.innerHTML = `<div class="gl ${GL_DIR}" style="--vis:${Math.min(GL_VIS, glN)}">
    <div class="gl-tit">✨ Galeria da semana<small>${acesos.length}/${todos.length}</small></div>
    <div class="gl-janela"><div class="gl-trilho" id="gl-trilho">${cards}${roda ? cards : ""}</div></div></div>`;
  posicionarGaleria(false);
  for (const id of novosAcesos) {
    raiz.querySelectorAll(`.gl-card[data-id="${CSS.escape(id)}"]`).forEach(el => el.classList.add("acendeu"));

  const passo = (GL_DIR === "h" ? card.offsetWidth : card.offsetHeight) + gap;
  tr.style.transition = animar ? "" : "none";
  tr.style.transform = GL_DIR === "h" ? `translateX(${-glIdx * passo}px)` : `translateY(${-glIdx * passo}px)`;
}

  setInterval(() => {

    glIdx++;

  }, GL_TEMPO);
}

function textoAlerta(a) {

  if (a.tipo === "presente") return {grupo: "presente", emo: "🎁", quem: a.nome, oque: `enviou ${a.qtd > 1 ? a.qtd + "× " : ""}${a.presente || "um presente"}!`};
  if (a.tipo === "galeria") return {grupo: "presente", emo: "✨", quem: a.nome, oque: `iluminou ${a.presente || "um presente"} na galeria!`};
  if (a.tipo === "meta") return {grupo: "metas", emo: "🎯", quem: `Meta de ${num(a.valor)} ${{seguidores: "seguidores", diamantes: "diamantes"}[a.meta_tipo] || "curtidas"}`, oque: "batida! Obrigado! 🎉"};
  if (a.tipo === "meta_tiktok") return {grupo: "metas", emo: "🎯", quem: `Meta: ${num(a.valor)} ${a.presente || ""}`, oque: "batida! Obrigado! 🎉"};

function receberAlertas(lista) {

const MUDO = P.get("mudo") === "1";

function receberVideos(lista) {
  if (ultimoVideo === null) { ultimoVideo = lista.length ? lista[lista.length - 1].id : 0; return; }   // não toca os antigos

function prioridadeVideo(t) {
  t = String(t || "");

  if (t === "presente" || t === "heart") return 2;   // presentes e Heart Me

}
// baixa os vídeos escolhidos antes de precisar (até 400 MB no total), para tocarem sem atraso
let preCarregando = false;
async function preCarregarVideos(lista) {
  if (preCarregando || !Array.isArray(lista)) return;
  preCarregando = true;
  let total = 0;
  for (const v of lista) {
    if (blobsVideo[v.url]) { total += v.mb || 0; continue; }
    if (total + (v.mb || 0) > 400) continue;
    try { await arquivoVideo(v.url); total += v.mb || 0; } catch (e) {}
  }
  preCarregando = false;
}
async function arquivoVideo(u) {
  // baixa pelo mesmo caminho dos dados (assim funciona também na página do GitHub, no LIVE Studio)
  if (blobsVideo[u]) return blobsVideo[u];
  const r = await fetch(API + u);
  if (!r.ok) throw new Error("vídeo não encontrado");
  return (blobsVideo[u] = URL.createObjectURL(await r.blob()));
}
async function proximoVideo() {
  const v = filaVideos.shift();
  if (!v) { tocandoVideo = false; return; }
  tocandoVideo = true;
  document.body.classList.add("videos");
  let el = document.getElementById("tela-video");
  if (!el) { el = document.createElement("video"); el.id = "tela-video"; el.playsInline = true; el.style.display = "none"; document.body.appendChild(el); }

    if (acabou) return;

    el.onended = el.onerror = null; el.pause(); el.style.display = "none";
    setTimeout(proximoVideo, 300);
  };
  try {
    el.src = await arquivoVideo(v.url);

const COR_TIPO = {seguir: "#fe2c55", heart: "#ff7aa2", presente: "#ffc83d", compartilhar: "#25f4ee"};
let pote = null;   // {engine, W, H, paredes, fundo, corpos: Map(id -> {body, ...}), vistos, fila, esvaziando}
const CHAVE_ESV = "pdl-pote-esvaziado-" + PT.recipiente;
function lerEsvaziado() { try { return Number(localStorage.getItem(CHAVE_ESV)) || 0; } catch (e) { return 0; } }
function gravarEsvaziado(v) { try { localStorage.setItem(CHAVE_ESV, String(v)); } catch (e) {} }

function perfilPote(cx, jw, jh, base) {
  // Pote de boca larga (sem tampa): rosca curta, ombro pequeno, corpo reto com friso
  // e a parte de baixo afinando até a base oval. Contorno da metade direita, de cima para baixo.
  const bw = jw / 2, nw = bw * .87, bb = bw * .8, topo = base - jh;
  const yG = topo + jh * .15, yO = yG + jh * .06, yF = topo + jh * .7, yC = yF + jh * .05;
  const meio = [[nw, topo], [nw, yG]];
  for (let k = 1; k <= 8; k++) { const a = k / 8 * Math.PI / 2; meio.push([nw + (bw - nw) * Math.sin(a), yG + (yO - yG) * (1 - Math.cos(a))]); }
  meio.push([bw, yF], [bw * .985, yF + jh * .012], [bw, yC]);           // friso
  for (let k = 1; k <= 12; k++) {                                       // afina até a base
    const f = k / 12, x = bw - (bw - bb) * Math.pow(f, 1.6), y = yC + (base - yC) * f;
    meio.push([x, y]);
  }
  meio.push([0, base]);
  return {cx, jw, jh, base, topo, bw, nw, bb, yG, yO, yF, yC, rb: 0, meio};
}
function caminhoPote(c, j) {
  c.beginPath();
  c.moveTo(j.cx + j.meio[0][0], j.meio[0][1]);
  j.meio.forEach(([x, y]) => c.lineTo(j.cx + x, y));
  [...j.meio].reverse().forEach(([x, y]) => c.lineTo(j.cx - x, y));
  c.closePath();
}
function iniciarPote() {
  document.body.classList.add("pote");
  const cv = document.createElement("canvas"); cv.id = "tela-pote"; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const {Engine, Bodies, Composite} = Matter;
  const engine = Engine.create({gravity: {x: 0, y: 1}});
  const est = {isStatic: true, friction: 0.3, restitution: 0.2};
  const esc = Number(getComputedStyle(document.documentElement).getPropertyValue("--escala")) || 1;
  const g = {W, H, ctx, engine, corpos: new Map(), vistos: new Set(), fila: [], esvaziando: false, cortado: lerEsvaziado()};
  g.raio = Math.max(12, Math.min(W, H) * 0.045 * esc);
  const fundo = [], lados = [];
  if (PT.recipiente === "chao") {
    fundo.push(Bodies.rectangle(W / 2, H + 25, W * 2, 50, est));
    lados.push(Bodies.rectangle(-25, H / 2, 50, H * 4, est), Bodies.rectangle(W + 25, H / 2, 50, H * 4, est));
    g.boca = [g.raio, W - g.raio];
  } else if (PT.recipiente === "pote") {
    // pote de vidro sem tampa: gargalo com rosca, ombros arredondados, corpo largo, fundo arredondado
    const jw = Math.min(W * .9, H * .82), jh = Math.min(H * .9, jw * 1.05), cx = W / 2, base = H - 14, e = 26;
    g.jar = perfilPote(cx, jw, jh, base);
    const meio = g.jar.meio, fundoY = base - 2;
    const pecas = (pts, sinal) => {
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
        if (L < .5) continue;
        const nx = sinal * dy / L, ny = sinal * -dx / L;   // normal para fora do pote
        const peca = Bodies.rectangle((x1 + x2) / 2 + nx * e / 2, (y1 + y2) / 2 + ny * e / 2, L + 3, e, {...est, angle: Math.atan2(dy, dx)});
        (y1 >= fundoY && y2 >= fundoY ? fundo : lados).push(peca);
      }
    };
    pecas(meio.map(([x, y]) => [cx + x, y]), 1);           // lado direito
    pecas(meio.map(([x, y]) => [cx - x, y]), -1);          // lado esquerdo (espelhado)
    g.boca = [cx - g.jar.nw + g.raio + 6, cx + g.jar.nw - g.raio - 6];
  } else {   // aquário redondo: arco de pedacinhos, aberto em cima

    conseguiu = true; falhas = 0;
    if (TOPS[TIPO]) desenharTop(d);
    else if (TIPO === "metas") desenharMetas(d);
    else if (TIPO === "batalha") desenharBatalha(d);
    else if (TIPO === "galeria") desenharGaleria(d);
    else if (TIPO === "alertas") receberAlertas(d.alertas || []);
    else if (TIPO === "videos") {
      if (TESTE_FIXO || emTeste) videoTeste(d);
      else { receberVideos(d.alertas || []); preCarregarVideos(d.videos_pre); }
    }
    else if (TIPO === "pote") { if (window.Matter) poteReceber(listaDoPote(d)); }
    else raiz.innerHTML = `<div class="caixa"><div class="tit">Overlay "${esc(TIPO)}" não existe</div></div>`;
  } catch (e) {
    // painel fechado ou bloqueado: mostra um aviso pequeno só se nunca conseguiu (ajuda a configurar)
    if (!conseguiu && ++falhas >= 4) raiz.innerHTML = `<div class="caixa"><div class="tit" style="font-size:.95rem">⚠️ Abra o XLiv neste computador</div></div>`;
  }
}
// ---------------- Tela única (palco): junta vários overlays numa página só ----------------
function urlPeca(p) {
  const naHtml = location.pathname.includes("overlay.html");
  const q = new URLSearchParams(p.params || "");
  q.set("tipo", p.tipo);
  q.set("escala", (p.k || 1).toFixed(3));           // o tamanho da peça vem do k (nítido), não de transform
  if (P.get("porta")) q.set("porta", P.get("porta"));
  if (P.get("teste")) q.set("teste", P.get("teste"));
  const base = naHtml ? location.pathname.replace(/[^/]*$/, "") + "overlay.html" : "/overlay/" + p.tipo;
  return base + "?" + q.toString();
}
const PALCO_BASE = {vertical: [1080, 1920], horizontal: [1920, 1080]};
const PALCO_REF = {curtidas: [300, 760], presentes: [300, 760], compartilhamentos: [300, 760], metas: [400, 390],
                   batalha: [510, 200], alertas: [490, 170], galeria: [700, 285], pote: [500, 700]};
let palcoAssinatura = "", palcoStage = null;
async function montarPalco() {
  try {
    const d = await (await fetch(API + "/api/palco", {cache: "no-store"})).json();
    const ass = JSON.stringify(d);
    if (ass === palcoAssinatura) return;                 // só remonta os iframes quando o arranjo muda
    palcoAssinatura = ass;
    const [W, H] = PALCO_BASE[d.orientacao === "horizontal" ? "horizontal" : "vertical"];
    // palco de tamanho fixo (1080×1920) que é escalado para caber na fonte do LIVE Studio:
    // assim cada peça fica igual ao que a pessoa montou no painel, em qualquer tamanho de tela.
    // cada overlay é desenhado no tamanho sugerido dele e sofre um zoom inteiro (k) — igual para todos
    raiz.innerHTML = `<div id="palco-stage" style="width:${W}px;height:${H}px"></div>`;
    // cada peça: o overlay é desenhado no tamanho de verdade (escala = k, sempre nítido) e a caixa
    // se ajusta ao conteúdo que ele informa (postMessage), então nada corta
    document.getElementById("palco-stage").innerHTML = (d.pecas || []).map((p, i) => {
      const [rw, rh] = PALCO_REF[p.tipo] || [400, 400];
      return `<iframe class="palco-peca" data-i="${i}" style="left:${p.x / 100 * W}px;top:${p.y / 100 * H}px;width:${rw * p.k}px;height:${rh * p.k}px" src="${urlPeca(p)}"></iframe>`;
    }).join("");
    palcoStage = {W, H};
    ajustarPalco();
  } catch (e) {}
}
window.addEventListener("message", (e) => {
  if (!e.data || !e.data.palcoPeca || !e.data.w) return;
  const ifr = [...document.querySelectorAll("#palco-stage iframe")].find(f => f.contentWindow === e.source);
  if (ifr) ifr.style.height = e.data.h + "px";   // largura fica fixa; só a altura se ajusta (senão as barras encolhem em loop)
});
function ajustarPalco() {
  const el = document.getElementById("palco-stage");
  if (!el || !palcoStage) return;
  const {W, H} = palcoStage, s = Math.min(innerWidth / W, innerHeight / H);
  el.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
}
if (window.parent !== window && TIPO !== "palco") {
  // informa à tela única o tamanho real do conteúdo, para a caixa se ajustar e não cortar
  const relatar = () => {
    let w = 0, h = 0;
    for (const c of raiz.children) { const r = c.getBoundingClientRect(); w = Math.max(w, r.right); h = Math.max(h, r.bottom); }
    if (w > 1 && h > 1) { try { parent.postMessage({palcoPeca: 1, w: Math.ceil(w) + 8, h: Math.ceil(h) + 8}, "*"); } catch (e) {} }
  };
  try { new ResizeObserver(relatar).observe(raiz); } catch (e) {}
  setInterval(relatar, 800);
}
if (TIPO === "palco") {
  document.body.classList.add("palco");
  window.addEventListener("resize", ajustarPalco);
  montarPalco();
  setInterval(montarPalco, 3000);
} else {
  atualizar();
  setInterval(atualizar, TIPO === "alertas" || TIPO === "videos" ? 700 : 1500);
}
</script>
